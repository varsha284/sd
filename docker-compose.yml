services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketlane
      POSTGRES_USER: ticketlane
      POSTGRES_PASSWORD: ticketlane_dev
    ports:
      - "5432:5432"
    volumes:
      - ticketlane-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketlane -d ticketlane"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  ticketlane-postgres:
